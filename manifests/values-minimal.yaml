host: rhdh.rz5kh.gcp.redhatworkshops.io

openshift:
  route:
    enabled: false

service:
  type: NodePort

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: rhdh-static-ip
    networking.gke.io/managed-certificates: rhdh-managed-cert
    networking.gke.io/v1beta1.FrontendConfig: rhdh-frontend-config

imagePullSecrets:
  - name: rhdh-pull-secret

podSecurityContext:
  fsGroup: 2000

# Minimal sizing for RHDH container
resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

# Bundled PostgreSQL with GKE volume permissions & minimal sizing
postgresql:
  image:
    pullSecrets:
      - rhdh-pull-secret
  primary:
    podSecurityContext:
      enabled: true
      fsGroup: 3000
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  volumePermissions:
    enabled: true
